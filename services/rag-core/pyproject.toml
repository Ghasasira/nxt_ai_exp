[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-core"
version = "0.1.0"
description = "Core ingestion, hybrid retrieval, and grounded generation service for the RAG Knowledge Agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "qdrant-client>=1.13.0,<2.0.0",
    "google-genai>=1.0.0,<4.0.0",
    "pypdf>=5.0.0,<8.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.0.0,<7.0.0",
    "redis>=5.0.0,<9.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "tiktoken>=0.8.0,<1.0.0",
]

[project.optional-dependencies]
onnx = [
    "fastembed>=0.5.0,<1.0.0",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
