x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.9-alpine
    container_name: rag-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-https://localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ${CADDYFILE_PATH:-./proxy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web-app:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-app:
    build:
      context: ./services/web-app
      dockerfile: Dockerfile
    image: nxt-ai/web-app:0.1.0-phase1
    container_name: rag-web-app
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_NAME: "RAG Knowledge Agent"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_URL: ${CADDY_SITE_ADDRESS:-https://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-rag_agent}
      DB_USERNAME: ${POSTGRES_USER:-rag_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RAG_CORE_URL: http://rag-core:8000
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:?RAG_INTERNAL_SECRET must be set}
      RAG_CALLBACK_SECRET: ${RAG_CALLBACK_SECRET:?RAG_CALLBACK_SECRET must be set}
      RAG_UPLOADS_DIR: /data/uploads
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-20}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      MONTHLY_SPEND_CAP_USD: ${MONTHLY_SPEND_CAP_USD:-200}
    volumes:
      - uploads_data:/data/uploads
      - ./backups:/data/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-core:
        condition: service_healthy
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') === false ? 1 : 0);"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17.11-alpine3.23
    container_name: rag-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_agent}
      POSTGRES_USER: ${POSTGRES_USER:-rag_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.9-alpine
    container_name: rag-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: rag-qdrant
    restart: unless-stopped
    logging: *default-logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "32"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.16
    container_name: rag-ollama
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
      - egress
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  rag-core:
    build:
      context: ./services/rag-core
      dockerfile: Dockerfile
    image: nxt-ai/rag-core:0.2.0-phase1
    container_name: rag-core
    restart: unless-stopped
    logging: *default-logging
    environment:
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:?RAG_INTERNAL_SECRET must be set}
      RAG_CALLBACK_SECRET: ${RAG_CALLBACK_SECRET:?RAG_CALLBACK_SECRET must be set}
      WEB_APP_CALLBACK_URL: http://web-app:8000/api/internal/ingestion-callback
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      UPLOADS_DIR: /data/uploads
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.0}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-1024}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-20}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-20}
      RERANK_TOP_N: ${RERANK_TOP_N:-5}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
    volumes:
      - uploads_data:/data/uploads:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - egress
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingest-worker:
    image: nxt-ai/rag-core:0.2.0-phase1
    container_name: rag-ingest-worker
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "app.worker"]
    environment:
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:?RAG_INTERNAL_SECRET must be set}
      RAG_CALLBACK_SECRET: ${RAG_CALLBACK_SECRET:?RAG_CALLBACK_SECRET must be set}
      WEB_APP_CALLBACK_URL: http://web-app:8000/api/internal/ingestion-callback
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      INGEST_MAX_WORKERS: ${INGEST_MAX_WORKERS:-2}
      UPLOADS_DIR: /data/uploads
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - uploads_data:/data/uploads:ro
    depends_on:
      rag-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  uploads_data:
